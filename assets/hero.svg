<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="Georgia, 'Times New Roman', serif">
  <style>
    .notif {
      animation: stack 24s cubic-bezier(0.2,0.8,0.2,1) infinite both;
      transform-box: fill-box;
      transform-origin: 50% 100%;
      opacity: 0;
    }
    @keyframes stack {
      0%      { transform: translateY(22px) scale(0.94);      opacity: 0; }
      2.3%    { transform: translateY(0) scale(1);            opacity: 1; }
      20%     { transform: translateY(0) scale(1);            opacity: 1; }
      23%     { transform: translateY(-56px) scale(0.95); opacity: 0.78; }
      40%     { transform: translateY(-56px) scale(0.95); opacity: 0.78; }
      43%     { transform: translateY(-112px) scale(0.90); opacity: 0.56; }
      57%     { transform: translateY(-112px) scale(0.90); opacity: 0.56; }
      60%     { transform: translateY(-126px) scale(0.88); opacity: 0; }
      100%    { transform: translateY(-126px) scale(0.88); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .notif { animation: none; }
      .notif:first-of-type { opacity: 1; }
    }
  </style>

  <!-- page background: keep it opaque so dark-mode GitHub doesn't show through -->
  <rect width="960" height="620" fill="#fdfdfb"/>

  <!-- pixel meadow, rendered once from the landing page's canvas algorithm -->
  <image href="data:image/png;base64," width="960" height="540" style="image-rendering:pixelated" preserveAspectRatio="none"/>

  <g fill="#ffffff">
    <g><animateTransform attributeName="transform" type="translate" from="-160 48" to="1000 48" dur="55s" begin="-38s" repeatCount="indefinite"/><rect x="0" y="24" width="156" height="36"/><rect x="24" y="12" width="60" height="24"/><rect x="72" y="0" width="60" height="36"/><rect x="120" y="12" width="36" height="24"/></g>
    <g><animateTransform attributeName="transform" type="translate" from="-120 114" to="1000 114" dur="80s" begin="-20s" repeatCount="indefinite"/><rect x="0" y="16.8" width="109.2" height="25.2"/><rect x="16.8" y="8.4" width="42" height="16.8"/><rect x="50.4" y="0" width="42" height="25.2"/><rect x="84" y="8.4" width="25.2" height="16.8"/></g>
    <g><animateTransform attributeName="transform" type="translate" from="-90 24" to="1000 24" dur="42s" begin="-5s" repeatCount="indefinite"/><rect x="0" y="12" width="78" height="18"/><rect x="12" y="6" width="30" height="12"/><rect x="36" y="0" width="30" height="18"/><rect x="60" y="6" width="18" height="12"/></g>
  </g>

  <!-- phone lying in the meadow (flattened to fake the CSS 3D tilt) -->
  <g transform="translate(700,455)">
    <ellipse cx="0" cy="18" rx="120" ry="26" fill="rgba(25,50,30,0.32)"/>
    <g transform="rotate(-9) scale(1,0.42) rotate(20)">
      <rect x="-78" y="-150" width="156" height="300" rx="26" fill="rgba(255,255,255,0.22)" stroke="#1a1c20" stroke-width="9"/>
      <rect x="-78" y="-150" width="156" height="300" rx="26" fill="none" stroke="#35383e" stroke-width="1.5"/>
      <rect x="-26" y="-138" width="52" height="14" rx="7" fill="#101114"/>
      <text x="0" y="-92" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="10" font-weight="600" fill="#ffffff" opacity="0.92">Wednesday, August 19</text>
      <text x="0" y="-48" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="44" font-weight="600" fill="#ffffff">09:41</text>
      <rect x="-30" y="136" width="60" height="4" rx="2" fill="rgba(255,255,255,0.9)"/>
    </g>
  </g>

  <!-- notification stack floating above the phone -->
  <g transform="translate(584,330)">

  <g class="notif" style="animation-delay:1.4s">
      <rect width="252" height="46" rx="12" fill="rgba(250,250,252,0.92)"/>
      <rect x="9" y="9" width="24" height="24" rx="7" fill="#2AABEE"/>
      <text x="21" y="26" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#ffffff">T</text>
      <text x="42" y="17" font-family="-apple-system,'Segoe UI',sans-serif" font-size="9" font-weight="600" fill="#1c1c1e">talbot</text>
      <text x="242" y="17" text-anchor="end" font-family="-apple-system,'Segoe UI',sans-serif" font-size="8" fill="#6b6b70">now</text>
      <text y="26" font-family="-apple-system,'Segoe UI',sans-serif" font-size="8.5" fill="#2c2c2e"><tspan x="42" dy="0">✅ Refactor complete — 42 files changed, all</tspan><tspan x="42" dy="12">218 tests passing. Take a look.</tspan></text>
  </g>
  <g class="notif" style="animation-delay:6.2s">
      <rect width="252" height="46" rx="12" fill="rgba(250,250,252,0.92)"/>
      <rect x="9" y="9" width="24" height="24" rx="7" fill="#2AABEE"/>
      <text x="21" y="26" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#ffffff">T</text>
      <text x="42" y="17" font-family="-apple-system,'Segoe UI',sans-serif" font-size="9" font-weight="600" fill="#1c1c1e">talbot</text>
      <text x="242" y="17" text-anchor="end" font-family="-apple-system,'Segoe UI',sans-serif" font-size="8" fill="#6b6b70">now</text>
      <text y="26" font-family="-apple-system,'Segoe UI',sans-serif" font-size="8.5" fill="#2c2c2e"><tspan x="42" dy="0">⚠️ Blocked: need your call on the DB</tspan><tspan x="42" dy="12">migration strategy.</tspan></text>
  </g>
  <g class="notif" style="animation-delay:11s">
      <rect width="252" height="46" rx="12" fill="rgba(250,250,252,0.92)"/>
      <rect x="9" y="9" width="24" height="24" rx="7" fill="#2AABEE"/>
      <text x="21" y="26" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#ffffff">T</text>
      <text x="42" y="17" font-family="-apple-system,'Segoe UI',sans-serif" font-size="9" font-weight="600" fill="#1c1c1e">talbot</text>
      <text x="242" y="17" text-anchor="end" font-family="-apple-system,'Segoe UI',sans-serif" font-size="8" fill="#6b6b70">now</text>
      <text y="31" font-family="-apple-system,'Segoe UI',sans-serif" font-size="8.5" fill="#2c2c2e"><tspan x="42" dy="0">✅ PR #128 ready for review.</tspan></text>
  </g>
  <g class="notif" style="animation-delay:15.8s">
      <rect width="252" height="46" rx="12" fill="rgba(250,250,252,0.92)"/>
      <rect x="9" y="9" width="24" height="24" rx="7" fill="#2AABEE"/>
      <text x="21" y="26" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#ffffff">T</text>
      <text x="42" y="17" font-family="-apple-system,'Segoe UI',sans-serif" font-size="9" font-weight="600" fill="#1c1c1e">talbot</text>
      <text x="242" y="17" text-anchor="end" font-family="-apple-system,'Segoe UI',sans-serif" font-size="8" fill="#6b6b70">now</text>
      <text y="26" font-family="-apple-system,'Segoe UI',sans-serif" font-size="8.5" fill="#2c2c2e"><tspan x="42" dy="0">✅ CI is green on main. Deploy went out</tspan><tspan x="42" dy="12">clean.</tspan></text>
  </g>
  <g class="notif" style="animation-delay:20.6s">
      <rect width="252" height="46" rx="12" fill="rgba(250,250,252,0.92)"/>
      <rect x="9" y="9" width="24" height="24" rx="7" fill="#2AABEE"/>
      <text x="21" y="26" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#ffffff">T</text>
      <text x="42" y="17" font-family="-apple-system,'Segoe UI',sans-serif" font-size="9" font-weight="600" fill="#1c1c1e">talbot</text>
      <text x="242" y="17" text-anchor="end" font-family="-apple-system,'Segoe UI',sans-serif" font-size="8" fill="#6b6b70">now</text>
      <text y="26" font-family="-apple-system,'Segoe UI',sans-serif" font-size="8.5" fill="#2c2c2e"><tspan x="42" dy="0">⚠️ Flaky test in auth suite — retried twice,</tspan><tspan x="42" dy="12">needs eyes.</tspan></text>
  </g>
  </g>

  <!-- wordmark -->
  <g text-anchor="middle">
    <text x="480" y="588" font-size="30" letter-spacing="16" fill="#3a3f35">talbot</text>
    <text x="480" y="612" font-size="13" font-style="italic" fill="#555b4e">stop watching your agents work; it'll text you</text>
  </g>

  <!-- frame -->
  <rect x="1.5" y="1.5" width="957" height="617" fill="none" stroke="#3a3f35" stroke-width="3"/>
</svg>
